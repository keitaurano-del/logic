    <rect x="219" y="40" width="64" height="12" rx="6" fill="#B25C3A"/>
    <text x="251" y="49" font-size="8" fill="#FBF6EC" text-anchor="middle">続ける</text>
    <rect x="465" y="20" width="48" height="30" rx="5" fill="#F4ECDD" stroke="#ddd"/>
    <rect x="535" y="20" width="48" height="30" rx="5" fill="#FBF6EC" stroke="#ddd"/>
    <rect x="605" y="20" width="48" height="30" rx="5" fill="#3A2F23"/>
    <rect x="675" y="20" width="48" height="30" rx="5" fill="#B25C3A"/>
  </g>

