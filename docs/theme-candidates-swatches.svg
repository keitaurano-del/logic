<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="620" fill="#fafafa"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1a1a1a">Logic 背景テーマ候補 — 6 案スウォッチ</text>
  <text x="24" y="58" font-size="12" fill="#666">各行: 左から bg / card / text / accent。中央のミニカードは実物プレビュー（card 上に text 見出しと accent ボタン）</text>

  <!-- header labels -->
  <text x="24" y="92" font-size="11" fill="#999">テーマ</text>
  <text x="200" y="92" font-size="11" fill="#999">プレビュー (bg → card)</text>
  <text x="470" y="92" font-size="11" fill="#999">bg</text>
  <text x="540" y="92" font-size="11" fill="#999">card</text>
  <text x="610" y="92" font-size="11" fill="#999">text</text>
  <text x="680" y="92" font-size="11" fill="#999">accent</text>

  <!-- rows: y0=110, step=80 -->
  <!-- Row template macro replaced manually per theme -->

  <!-- 1 Sepia (light) -->
  <g transform="translate(0,110)">
