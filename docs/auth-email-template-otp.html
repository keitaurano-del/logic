<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Logic ログインリンク / Login link</title>
  </head>
  <body style="margin:0;padding:24px;background:#F5F7FB;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;color:#1F2937;line-height:1.6;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
      <tr>
        <td style="padding:32px 32px 24px;">
          <div style="font-size:18px;font-weight:700;color:#3D5FC4;letter-spacing:0.04em;margin:0 0 24px;">Logic</div>

          <p style="font-size:15px;margin:0 0 4px;color:#1F2937;">下のボタンをタップして Logic にログインしてください。</p>
          <p style="font-size:13px;margin:0 0 24px;color:#6B7280;">Tap the button below to log in to Logic.</p>

          <p style="margin:0 0 16px;text-align:center;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;background:#3D5FC4;color:#FFFFFF;font-weight:700;font-size:16px;border-radius:10px;text-decoration:none;">アプリでログイン / Open in app</a>
          </p>

          <p style="font-size:11px;margin:0 0 20px;color:#9CA3AF;word-break:break-all;text-align:center;">{{ .ConfirmationURL }}</p>

          <p style="font-size:13px;margin:0 0 4px;color:#6B7280;">このリンクは <strong style="color:#1F2937;">1時間</strong> 有効です。</p>
          <p style="font-size:13px;margin:0 0 24px;color:#6B7280;">This link expires in <strong style="color:#1F2937;">1 hour</strong>.</p>

          <hr style="border:0;border-top:1px solid #E5E7EB;margin:24px 0;" />

          <p style="font-size:12px;margin:0;color:#9CA3AF;">
            心当たりがない場合はこのメールを無視してください。<br />
            If you didn&rsquo;t request this link, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
