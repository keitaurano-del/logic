name: Generate Keystore (one-time setup)

# このワークフローは一度だけ手動実行する。
# 生成されたbase64をArtifactからコピーしてGitHub Secretsに保存すること。
#   ANDROID_KEYSTORE_BASE64 = 出力されたbase64文字列
#   ANDROID_KEYSTORE_PASSWORD = 入力したパスワード
#   ANDROID_KEY_ALIAS = logicalthinking

on:
  workflow_dispatch:
    inputs:
      password:
        description: "キーストアのパスワード（ANDROID_KEYSTORE_PASSWORDと同じ値を入れること）"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore logicalthinking-release.keystore \
            -alias logicalthinking \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=LogicalThinking, OU=App, O=LogicalThinking, L=Tokyo, S=Tokyo, C=JP" \
            -noprompt
          echo "── SHA1 ──"
          keytool -list -keystore logicalthinking-release.keystore \
            -storepass "${{ github.event.inputs.password }}" \
            -alias logicalthinking
          echo "── base64 (これをANDROID_KEYSTORE_BASE64に設定) ──"
          base64 -w 0 logicalthinking-release.keystore > keystore.b64
          cat keystore.b64

      - name: Upload base64 as artifact
        uses: actions/upload-artifact@v7
        with:
          name: keystore-base64
          path: keystore.b64
          retention-days: 1
