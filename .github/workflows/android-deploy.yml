name: Android Deploy → Play Console (Internal Test, promote to Alpha via UI)

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手動トリガーも可能

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # コミットメッセージに [skip android] が含まれていればスキップ。
    # 「Web だけ反映したい」PR のマージコミット用エスケープハッチ。
    # workflow_dispatch（手動起動）の場合は head_commit が無いので常に実行。
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip android]') }}

    steps:
      # ── 1. チェックアウト ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Node.js セットアップ ───────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Java (JDK 21) セットアップ — Capacitor 8 / AGP 8.13 要件 ──
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 4. Android SDK セットアップ ───────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ── 5. npm install ─────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Web ビルド (Vite) ──────────────────────────────
      #      DF-F21: フィードバックの app_version を本番ビルドに焼き込むため
      #      VITE_APP_VERSION を注入する。versionName（android/app/build.gradle）と
      #      同じ採番 1.5.<run_number> に揃え、Play 配信版とバージョン表記を一致させる。
      - name: Build web (Vite)
        run: npm run build
        env:
          VITE_APP_VERSION: 1.5.${{ github.run_number }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # AF-06: WebP バンドル化完了後に true に切り替える
          VITE_REMOTE_LESSON_ASSETS: "false"
          VITE_LESSON_ASSET_BASE_URL: https://yctlelmlwjwlcpcxvmgx.supabase.co/storage/v1/object/public/lesson-assets

      # ── 7. Capacitor: android/ ディレクトリを追加 ─────────
      #      初回のみ必要。android/ が既にある場合はスキップ
      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── 8. Capacitor Sync ─────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 9. versionCode を GITHUB_RUN_NUMBER で設定 ────────
      #      毎回ユニークなversionCodeを保証するためRUN_NUMBERを使用
      - name: Set Android versionCode and versionName from run number
        run: |
          GRADLE=android/app/build.gradle
          # versionCode: RUN_NUMBER + 1000
          VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE"
          # versionName: 1.5.<RUN_NUMBER> 形式で自動インクリメント
          VERSION_NAME="1.5.${{ github.run_number }}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$GRADLE"
          echo "✓ versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          grep -E "versionCode|versionName" "$GRADLE"

      # ── 10. Gradle キャッシュ ─────────────────────────────
      # Kotlin コンパイルタスクがキャッシュにより SKIPPED になり
      # MainActivity 等が DEX に含まれない問題を防ぐため、
      # キャッシュを完全に無効化してクリーンビルドを強制する。
      # （gradle-wrapper だけキャッシュして依存ダウンロードを節約）
      - name: Cache Gradle wrapper only
        uses: actions/cache@v5
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      # ── 11. キーストアをSecretからリストアして key.properties を作成 ──
      - name: Restore keystore and write key.properties
        run: |
          mkdir -p keystores
          KEYSTORE_PATH=keystores/logicalthinking-release.keystore
          ALIAS=logicalthinking
          PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          B64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$KEYSTORE_PATH"
            echo "✓ Keystore restored from secret ($( wc -c < $KEYSTORE_PATH ) bytes)"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret が未設定です"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -alias "$ALIAS" > /dev/null \
            && echo "✓ Keystore verified" \
            || { echo "::error::キーストアの検証失敗（パスワードまたはエイリアスが不正）"; exit 1; }
          printf 'LOGIC_KEYSTORE_FILE=../../keystores/logicalthinking-release.keystore\nLOGIC_KEYSTORE_PASSWORD=%s\nLOGIC_KEY_ALIAS=%s\nLOGIC_KEY_PASSWORD=%s\n' "$PASSWORD" "$ALIAS" "$PASSWORD" > android/key.properties
          echo "✓ key.properties written"

      # ── 12. AAB ビルド ────────────────────────────────────
      # clean を先に実行して古い MainActivity.class キャッシュを完全削除する
      # （MainActivity.java と .kt が両方存在した期間のキャッシュが残っていると
      #   ClassNotFoundException の原因になりうる）
      - name: Build release AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --stacktrace

      # ── 13. AAB を成果物として保存 ───────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 14. Play Console 内部テストに配信 ──────────────────
      #      Production 初回公開済みなので status: completed で
      #      内部テスターへ自動 rollout する。
      - name: Deploy to Play Console (Internal Test)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.logicalthinking.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
          inAppUpdatePriority: 2
