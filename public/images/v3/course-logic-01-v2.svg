<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <!--
    Logic Handdrawn Style — Pilot v2
    Course: ロジカルシンキング入門 (course-logic-01)
    変更点 (v1 比):
      - 紙テクスチャを微増 (feTurbulence baseFrequency 0.65 + opacity 0.045)
      - 罫線をライトベージュ寄り (#E8DDC4) にしてノート感強化
      - 手描き図解を Pencil Stroke 風 (二重線 + jitter) に
      - フォントスタックを Caveat / Patrick Hand / Klee One 優先 (日本語手書き対応)
      - 学ぶことリストを「✓ チェック手書き」風 SVG パスに置き換え
      - 右下に控えめなインクスタンプ (Logic ロゴ簡易版)
  -->
  <defs>
    <!-- 紙テクスチャ: 粗目のノイズを薄く重ねる -->
    <filter id="paperTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.18 0"/>
    </filter>

    <!-- 線の揺らぎ (細) — 罫線・補助線用 -->
    <filter id="jitterFine" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 線の揺らぎ (中) — 図形・矩形の輪郭用 -->
    <filter id="jitterMed" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- ペン先のかすれ (主役要素) -->
    <filter id="inkBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 罫線 (手帳ノート) -->
    <pattern id="ruled" x="0" y="0" width="800" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="29" x2="800" y2="29" stroke="#D9CDB0" stroke-width="0.65" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- 用紙ベース (生成りクリーム) -->
  <rect width="800" height="400" fill="#FDF8E9"/>
  <rect width="800" height="400" fill="url(#ruled)"/>
  <!-- 紙テクスチャ overlay -->
  <rect width="800" height="400" filter="url(#paperTex)" opacity="0.55"/>

  <!-- 左マージン縦罫 (朱赤) -->
  <line x1="72" y1="0" x2="72" y2="400" stroke="#C8634B" stroke-width="1.6" filter="url(#jitterFine)" opacity="0.78"/>

  <!-- タイトル下線 (手描き波線) -->
  <path d="M82,82 Q200,76 320,82 T560,82" stroke="#3D5FC4" stroke-width="2.2" fill="none" filter="url(#jitterFine)" opacity="0.55"/>

  <!-- タイトル -->
  <text x="86" y="56" font-family="'Caveat','Patrick Hand','Klee One','Yuji Mai','Bradley Hand','Segoe Print',cursive" font-size="32" font-weight="700" fill="#1F2A44">ロジカルシンキング入門</text>
  <text x="88" y="76" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="16" fill="#3D5FC4" opacity="0.85">論理の基礎 — 構造化思考</text>

  <!-- 中央仕切り罫 -->
  <line x1="420" y1="100" x2="420" y2="360" stroke="#C9BFA7" stroke-width="0.9" stroke-dasharray="3 4" opacity="0.6" filter="url(#jitterFine)"/>

  <!-- 左ブロック: ロジックツリー手描き図解 -->
  <g transform="translate(96,108)">
    <!-- 親ノード (問題) -->
    <g filter="url(#jitterMed)">
      <rect x="0" y="70" width="92" height="40" rx="6" fill="#EEF2FE" stroke="#3D5FC4" stroke-width="2.2"/>
    </g>
    <text x="46" y="95" text-anchor="middle" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="17" font-weight="700" fill="#3D5FC4">問題</text>

    <!-- 枝 (鉛筆風) -->
    <g stroke="#5B5340" stroke-width="1.5" fill="none" opacity="0.72" filter="url(#inkBleed)">
      <path d="M92,90 Q110,90 130,52"/>
      <path d="M92,90 L130,90"/>
      <path d="M92,90 Q110,90 130,128"/>
    </g>

    <!-- 子ノード × 3 -->
    <g filter="url(#jitterMed)">
      <rect x="130" y="36" width="84" height="32" rx="5" fill="#FFF" stroke="#3D5FC4" stroke-width="2"/>
      <rect x="130" y="76" width="84" height="32" rx="5" fill="#FFF" stroke="#3D5FC4" stroke-width="2"/>
      <rect x="130" y="116" width="84" height="32" rx="5" fill="#FFF" stroke="#3D5FC4" stroke-width="2"/>
    </g>
    <text x="172" y="56" text-anchor="middle" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="14" fill="#1F2A44">原因 A</text>
    <text x="172" y="96" text-anchor="middle" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="14" fill="#1F2A44">原因 B</text>
    <text x="172" y="136" text-anchor="middle" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="14" fill="#1F2A44">原因 C</text>

    <!-- 付箋 (折れ角) -->
    <g transform="translate(36,180) rotate(-6)" filter="url(#inkBleed)">
      <path d="M0,0 H92 V42 L84,50 H0 Z" fill="#FFE383" stroke="#B89421" stroke-width="0.8"/>
      <path d="M84,50 L92,42 L84,42 Z" fill="#E2C150"/>
      <text x="10" y="20" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="12" fill="#6B4F12">So What?</text>
      <text x="10" y="36" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="12" fill="#6B4F12">Why So?</text>
    </g>
  </g>

  <!-- 右ブロック: 学ぶことリスト -->
  <g transform="translate(440,108)">
    <text x="0" y="0" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="20" font-weight="700" fill="#1F2A44">📝 学ぶこと</text>
    <line x1="0" y1="8" x2="240" y2="8" stroke="#3D5FC4" stroke-width="1.4" filter="url(#jitterFine)" opacity="0.45"/>

    <!-- リスト項目 (✓ + テキスト) -->
    <g font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="16" fill="#1F2A44">
      <g transform="translate(0,32)">
        <path d="M2,2 L8,9 L18,-3" stroke="#3D5FC4" stroke-width="2.4" fill="none" filter="url(#inkBleed)"/>
        <text x="28" y="8">論理構造を可視化する</text>
      </g>
      <g transform="translate(0,60)">
        <path d="M2,2 L8,9 L18,-3" stroke="#3D5FC4" stroke-width="2.4" fill="none" filter="url(#inkBleed)"/>
        <text x="28" y="8">MECE で漏れなく分ける</text>
      </g>
      <g transform="translate(0,88)">
        <path d="M2,2 L8,9 L18,-3" stroke="#3D5FC4" stroke-width="2.4" fill="none" filter="url(#inkBleed)"/>
        <text x="28" y="8">So What? / Why So?</text>
      </g>
      <g transform="translate(0,116)">
        <path d="M2,2 L8,9 L18,-3" stroke="#3D5FC4" stroke-width="2.4" fill="none" filter="url(#inkBleed)"/>
        <text x="28" y="8">ピラミッド原則で伝える</text>
      </g>
      <g transform="translate(0,144)">
        <path d="M2,2 L8,9 L18,-3" stroke="#3D5FC4" stroke-width="2.4" fill="none" filter="url(#inkBleed)"/>
        <text x="28" y="8">根拠 → 主張の流れ</text>
      </g>
    </g>
  </g>

  <!-- 右下 ブランドスタンプ -->
  <g transform="translate(700,360) rotate(-6)" opacity="0.85">
    <rect x="-46" y="-16" width="92" height="32" rx="3" fill="none" stroke="#C8634B" stroke-width="1.6" filter="url(#jitterMed)"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Caveat','Patrick Hand','Klee One','Bradley Hand',cursive" font-size="15" font-weight="700" fill="#C8634B" filter="url(#inkBleed)">Logic</text>
  </g>
</svg>
