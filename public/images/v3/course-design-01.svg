<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="decoDS" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shapeDS" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ruledDS" x="0" y="0" width="800" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27" x2="800" y2="27" stroke="#B3D0F5" stroke-width="0.85"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="#FEFEF2"/>
  <rect width="800" height="400" fill="url(#ruledDS)" opacity="0.65"/>
  <line x1="72" y1="0" x2="72" y2="400" stroke="#F4A0A0" stroke-width="1.8" filter="url(#decoDS)"/>
  <line x1="756" y1="14" x2="756" y2="386" stroke="#B3D0F5" stroke-width="1" opacity="0.4" filter="url(#decoDS)"/>
  <rect x="78" y="13" width="220" height="38" fill="#3F8FE8" opacity="0.2" rx="3" filter="url(#decoDS)"/>
  <text x="86" y="44" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="24" font-weight="bold" fill="#1A1A2E">デザインシンキング</text>
  <text x="87" y="67" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#3F8FE8">人間中心のイノベーション</text>
  <line x1="78" y1="77" x2="736" y2="77" stroke="#3F8FE8" stroke-width="1.2" opacity="0.28" filter="url(#decoDS)"/>
  <line x1="418" y1="80" x2="418" y2="370" stroke="#B3D0F5" stroke-width="0.9" opacity="0.5" filter="url(#decoDS)"/>
  <!-- 図形：フィルター適用 -->
  <g transform="translate(82,88)" filter="url(#shapeDS)">

    <polygon points="8,102 114,28 220,102 114,176" fill="#3F8FE8" opacity="0.62" transform="rotate(-0.5 114 102)"/>
    <polygon points="222,102 328,28 434,102 328,176" fill="#3F8FE8" opacity="0.38" transform="rotate(0.5 328 102)"/>
    <line x1="220" y1="26" x2="220" y2="178" stroke="#444" stroke-width="1.2" opacity="0.2"/>
    <g transform="translate(4,194) rotate(-9)">
      <rect x="0" y="0" width="36" height="9" rx="2" fill="#FFD566" opacity="0.88"/>
      <polygon points="36,0 46,4.5 36,9" fill="#E8A000" opacity="0.82"/>
      <rect x="0" y="1" width="5" height="7" rx="1" fill="#F4A0A0" opacity="0.92"/>
    </g>
  </g>
  <!-- ラベル：フィルターなし -->
  <g transform="translate(82,88)">

    <text x="114" y="98" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#fff">発散</text>
    <text x="114" y="115" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff">共感・定義</text>
    <text x="328" y="98" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="14" fill="#333">収束</text>
    <text x="328" y="115" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#444">試作・検証</text>
  </g>
  <!-- テキストリスト：フィルターなし -->
  <g transform="translate(432,88)">
<text x="0" y="2" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="bold" fill="#1A1A2E" opacity="0.82">🔄 プロセス</text>
<rect x="0" y="7" width="286" height="2" fill="#3F8FE8" opacity="0.4" rx="1"/>
  <rect x="1" y="26" width="11" height="11" fill="#3F8FE8" opacity="0.92" rx="1.5" transform="rotate(-2 6 31)"/>
  <text x="20" y="39" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#1A1A2E" opacity="0.92">共感：ユーザー観察</text>
  <line x1="0" y1="46" x2="286" y2="46" stroke="#B3D0F5" stroke-width="0.8" opacity="0.4"/>
  <rect x="1" y="66" width="11" height="11" fill="#3F8FE8" opacity="0.86" rx="1.5" transform="rotate(-2 6 71)"/>
  <text x="20" y="79" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#1A1A2E" opacity="0.86">定義：課題を明確化</text>
  <line x1="0" y1="86" x2="286" y2="86" stroke="#B3D0F5" stroke-width="0.8" opacity="0.4"/>
  <rect x="1" y="106" width="11" height="11" fill="#3F8FE8" opacity="0.80" rx="1.5" transform="rotate(-2 6 111)"/>
  <text x="20" y="119" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#1A1A2E" opacity="0.80">発想：アイデア爆発</text>
  <line x1="0" y1="126" x2="286" y2="126" stroke="#B3D0F5" stroke-width="0.8" opacity="0.4"/>
  <rect x="1" y="146" width="11" height="11" fill="#3F8FE8" opacity="0.74" rx="1.5" transform="rotate(-2 6 151)"/>
  <text x="20" y="159" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#1A1A2E" opacity="0.74">試作：プロトタイプ</text>
  <line x1="0" y1="166" x2="286" y2="166" stroke="#B3D0F5" stroke-width="0.8" opacity="0.4"/>
  <rect x="1" y="186" width="11" height="11" fill="#3F8FE8" opacity="0.68" rx="1.5" transform="rotate(-2 6 191)"/>
  <text x="20" y="199" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#1A1A2E" opacity="0.68">検証：フィードバック</text>
  <line x1="0" y1="206" x2="286" y2="206" stroke="#B3D0F5" stroke-width="0.8" opacity="0.4"/>

  </g>
  <line x1="78" y1="373" x2="736" y2="373" stroke="#1A1A2E" stroke-width="0.6" opacity="0.1" filter="url(#decoDS)"/>
  <text x="400" y="390" text-anchor="middle" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="11" fill="#3F8FE8" opacity="0.6">人間中心のイノベーション</text>
</svg>