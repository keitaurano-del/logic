<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-ww1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2942"/>
      <stop offset="100%" stop-color="#101729"/>
    </linearGradient>
    <radialGradient id="glow-ww1" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="depth-ww1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#F59E42"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg-ww1)"/>
  <circle cx="400" cy="220" r="280" fill="url(#glow-ww1)"/>

  <!-- 表面（症状） -->
  <g transform="translate(220,80)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#1A2540" stroke="#F87171" stroke-width="2" opacity="0.95"/>
    <text x="0" y="-2" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="11" fill="#F87171" font-weight="700" letter-spacing="0.5">SYMPTOM / 症状</text>
    <text x="0" y="14" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">機械が止まった</text>
  </g>

  <!-- 5階層チェーン（中央〜右側に配置） -->
  <g font-family="'SF Pro Display','Helvetica Neue',sans-serif">
    <!-- Why 1 -->
    <g transform="translate(380,140)">
      <circle cx="0" cy="0" r="20" fill="#1A2540" stroke="#F87171" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#F87171" font-weight="800">Why 1</text>
    </g>
    <text x="420" y="144" font-size="12" fill="#E5E7EB" font-weight="600">ヒューズが切れた</text>

    <!-- Why 2 -->
    <g transform="translate(380,190)">
      <circle cx="0" cy="0" r="20" fill="#1A2540" stroke="#FB923C" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#FB923C" font-weight="800">Why 2</text>
    </g>
    <text x="420" y="194" font-size="12" fill="#E5E7EB" font-weight="600">過負荷がかかった</text>

    <!-- Why 3 -->
    <g transform="translate(380,240)">
      <circle cx="0" cy="0" r="20" fill="#1A2540" stroke="#F59E42" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#F59E42" font-weight="800">Why 3</text>
    </g>
    <text x="420" y="244" font-size="12" fill="#E5E7EB" font-weight="600">潤滑が不足</text>

    <!-- Why 4 -->
    <g transform="translate(380,290)">
      <circle cx="0" cy="0" r="20" fill="#1A2540" stroke="#A7F3D0" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#A7F3D0" font-weight="800">Why 4</text>
    </g>
    <text x="420" y="294" font-size="12" fill="#E5E7EB" font-weight="600">ポンプ軸が摩耗</text>

    <!-- Why 5（根本原因） -->
    <g transform="translate(380,340)">
      <circle cx="0" cy="0" r="24" fill="#34D399"/>
      <text x="0" y="5" text-anchor="middle" font-size="11" fill="#0B2027" font-weight="800">Why 5</text>
    </g>
    <text x="420" y="338" font-size="13" fill="#34D399" font-weight="800">ストレーナ未装着</text>
    <text x="420" y="352" font-size="10" fill="#A7F3D0" font-weight="600" opacity="0.85">→ 真の対策はここ</text>
  </g>

  <!-- 縦の連結線（グラデーション） -->
  <line x1="380" y1="100" x2="380" y2="120" stroke="#F87171" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="380" y1="160" x2="380" y2="170" stroke="url(#depth-ww1)" stroke-width="2"/>
  <line x1="380" y1="210" x2="380" y2="220" stroke="url(#depth-ww1)" stroke-width="2"/>
  <line x1="380" y1="260" x2="380" y2="270" stroke="url(#depth-ww1)" stroke-width="2"/>
  <line x1="380" y1="310" x2="380" y2="316" stroke="url(#depth-ww1)" stroke-width="2"/>

  <!-- 「深掘り」インジケータ（左側に縦の矢印とラベル） -->
  <g transform="translate(120,220)">
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#7AAEFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <polygon points="-7,98 0,114 7,98" fill="#7AAEFF" opacity="0.85"/>
    <text x="0" y="-120" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="10" fill="#7AAEFF" font-weight="700" letter-spacing="0.5">表層</text>
    <text x="0" y="6" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="11" fill="#FFD566" font-weight="800" letter-spacing="0.5">深掘り</text>
    <text x="0" y="130" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',sans-serif" font-size="10" fill="#34D399" font-weight="700" letter-spacing="0.5">構造</text>
  </g>

  <!-- 装飾：星 -->
  <g fill="#7AAEFF" opacity="0.5">
    <circle cx="80" cy="50" r="1.4"/>
    <circle cx="220" cy="36" r="1.0"/>
    <circle cx="660" cy="50" r="1.2"/>
    <circle cx="730" cy="80" r="1.4"/>
    <circle cx="700" cy="380" r="1.0"/>
  </g>
</svg>
