previews:
  generation: automatic
  expireAfterDays: 7

services:
  - type: web
    name: logic
    runtime: node
    autoDeploy: true
    previews:
      generation: automatic
    # DF-F21: フィードバックの app_version を Web ビルドへ焼き込む。
    # VITE_APP_VERSION が Render ダッシュボードで明示設定されていればそれを尊重し、
    # 未設定（空）なら web-<commit短縮SHA> を採番する。さらに vite.config 側にも
    # package.json version ベースのフォールバックがあるため 'unknown' にはならない。
    buildCommand: |
      export VITE_APP_VERSION="${VITE_APP_VERSION:-web-${RENDER_GIT_COMMIT:0:7}}"
      npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: STRIPE_PRICE_BASIC_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BASIC_YEARLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_YEARLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_YEARLY
        sync: false
      - key: STRIPE_PRICE_BETA_CAMPAIGN
        sync: false
      # Report problem: email
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REPORT_EMAIL_TO
        value: keita.urano2@gmail.com
      # Report problem: Jira
      - key: JIRA_URL
        value: https://logic.atlassian.net
      - key: JIRA_EMAIL
        value: keita.urano@gmail.com
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        value: SCRUM
      # Admin override
      - key: ADMIN_SECRET
        sync: false
      # AI
      - key: ANTHROPIC_API_KEY
        sync: false
      # Frontend env (Vite build time)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE
        sync: false
      # Sentry (DSN 未設定でも build は通る、init は no-op になる)
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_APP_VERSION
        sync: false
      # AF-06: レッスンアセットのオンデマンド取得（Supabase Storage）
      - key: VITE_REMOTE_LESSON_ASSETS
        value: "true"
      - key: VITE_LESSON_ASSET_BASE_URL
        value: https://yctlelmlwjwlcpcxvmgx.supabase.co/storage/v1/object/public/lesson-assets
